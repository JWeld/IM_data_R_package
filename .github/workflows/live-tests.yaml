# Runs the test suite against the live data repository.
#
# The R-CMD-check workflow runs offline, as CRAN does, so it cannot see the
# repository change under the package. In autumn 2026 it did: the repository
# moved its files, every download failed with HTTP 401, and R CMD check stayed
# green, because the network examples are wrapped in try() and the live tests
# are skipped on CRAN. This workflow runs those live tests on every push and
# pull request, weekly, and on demand, so the next such change fails here.
#
# ICPIM_REQUIRE_REPOSITORY makes an unreachable repository a failure rather
# than a skip. A change that broke the API itself would otherwise skip every
# test that could have noticed it, and pass.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:

name: live-tests

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      ICPIM_REQUIRE_REPOSITORY: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools

      - name: Run the tests against the live repository
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'
