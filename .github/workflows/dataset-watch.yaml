# Watches the repository for a new dataset release, and verifies the package
# still reads whatever is published. Runs monthly, so nobody has to remember.
#
# The package reads the newest release by default, so "new" here cannot mean
# newer than what a session reads - that is always the newest. It means newer
# than the release the bundled code lists were built from (IM_BUNDLED_VERSION),
# which is the thing a maintainer has to act on.
#
# On a new version, or on any verification failure, it opens (or updates) a
# GitHub issue. It changes nothing itself.

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      version:
        description: 'Dataset version to verify (blank = newest release)'
        required: false

name: dataset-watch

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools

      - name: Check for a newer dataset version
        id: check
        run: |
          Rscript -e '
            devtools::load_all(quiet = TRUE)
            # Pinned to the bundled release: the default is "latest", under
            # which im_check_version() would compare the newest release with
            # itself. Pinned, "newer" means newer than the bundled code lists.
            options(icpim.version = IM_BUNDLED_VERSION)
            chk    <- im_check_version(quiet = TRUE)
            latest <- if (is.na(chk$latest)) "unknown" else chk$latest
            cat(sprintf("current=%s\n", chk$current), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            cat(sprintf("latest=%s\n", latest), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            cat(sprintf("newer=%s\n", tolower(chk$newer_available)), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            cat("bundled:", chk$current, " latest:", latest, "\n")
          '

      - name: Verify the package against the published data
        id: verify
        continue-on-error: true
        # Named explicitly: GitHub's default shell runs without pipefail, so
        # the `| tee` below would report tee's exit status and a failing
        # verification would never reach the issue step.
        shell: bash
        env:
          # Blank means the newest release, which is what verify_release.R and
          # the package both default to.
          ICPIM_VERSION: ${{ inputs.version }}
        run: |
          Rscript data-raw/verify_release.R 2>&1 | tee verify.log

      - name: Open or update an issue when something needs attention
        if: steps.check.outputs.newer == 'true' || steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('verify.log')
              ? fs.readFileSync('verify.log', 'utf8').slice(-8000)
              : '(no output)';
            const newer = '${{ steps.check.outputs.newer }}' === 'true';
            const failed = '${{ steps.verify.outcome }}' === 'failure';
            const latest = '${{ steps.check.outputs.latest }}';
            const current = '${{ steps.check.outputs.current }}';

            const title = newer
              ? `ICP IM dataset version ${latest} published`
              : `Dataset verification failing`;

            const body = [
              newer
                ? `Version **${latest}** is available. Sessions already read it by default, but the bundled code lists were built from **${current}**.`
                : `Verification of the published data failed (latest: **${latest}**, bundled: **${current}**).`,
              '',
              failed
                ? 'The verification run reported problems:'
                : 'Verification passed against the new release, so reading it should already work.',
              '',
              '```',
              log,
              '```',
              '',
              '### To rebuild the package against a new version',
              '',
              '1. `ICPIM_VERSION=<n> Rscript data-raw/verify_release.R` and read the output.',
              '2. Bump `IM_BUNDLED_VERSION` in `R/api.R` and the DOI and year in',
              '   `IM_BUNDLED_INFO` in `R/manifest.R`. `IM_DEFAULT_VERSION` stays `"latest"`.',
              '3. Rerun `data-raw/make_data.R` to rebuild the bundled code lists against',
              '   the new release, updating it first if step 1 flagged a new or renamed',
              '   subprogramme. A test asserts the constant agrees with the stamp the',
              '   script writes, so doing 2 without 3 fails rather than labelling the old',
              '   lists as the new release. Note the move in `NEWS.md`.',
              '',
              'Row counts, file sizes and year ranges need no updating: `im_manifest()`',
              'and `im_coverage()` measure them at run time.'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dataset-watch'
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['dataset-watch']
              });
            }
